# fly.toml app configuration file generated for maps-2-0 on 2026-09-10T18:22:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maps-2-0'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLIENT_DIR = 'dist'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
