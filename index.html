<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Turn-by-Turn-Navigation mit automatischer Reichweiten-Überwachung und Vorschlägen für günstige Tankstellen und Ladesäulen entlang der Route."
    />

    <!-- iOS: nötig, damit die PWA vom Home-Bildschirm im Standalone-Modus
         startet — nur dann steht dort Web Push überhaupt zur Verfügung. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reichweite" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />

    <title>Reichweite – Tank- &amp; Ladestopp-Navigation</title>

    <!--
      Das Thema vor dem ersten Zeichnen setzen. Ohne das blitzt beim Laden
      kurz das dunkle Standardthema auf, bevor React die Wahl anwendet.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('reichweite:theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Diese App benötigt JavaScript für Karte und Navigation.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
