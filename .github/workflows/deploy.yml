name: Deploy zu Fly.io

# Manuell per Knopfdruck ("Run workflow") und automatisch bei Push auf den
# Entwicklungsbranch. Der manuelle Weg ist der wichtige: er lässt sich vom
# Handy aus über die GitHub-Oberfläche auslösen, ohne Terminal.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/fuel-charging-finder-app-k31ptb

# Zwei gleichzeitige Deploys derselben App würden sich gegenseitig überholen.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  pruefen:
    name: Tests und Typprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Ein Deploy, der eine rote Testsuite ausliefert, kostet mehr als er nützt.
      - name: Typprüfung
        run: npx tsc -b --noEmit

      - name: Tests
        run: npm test

  deploy:
    name: Bauen und ausliefern
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Token vorhanden?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN fehlt. Unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi

      # Beim allerersten Lauf existiert die App auf Fly noch nicht.
      #
      # Die Organisation lässt sich über die Repository-Variable FLY_ORG
      # setzen (Settings → Secrets and variables → Actions → Variables);
      # ohne Angabe nimmt Fly die persönliche Organisation.
      - name: App anlegen, falls noch nicht vorhanden
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
          FLY_APP: ${{ vars.FLY_APP }}
        run: |
          # Repository-Variable FLY_APP hat Vorrang vor fly.toml, damit sich der
          # App-Name ohne Code-Änderung setzen lässt.
          APP="${FLY_APP:-$(grep -E '^app\s*=' fly.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')}"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"
          echo "Organisation: $FLY_ORG"

          # Fly-Namen: nur Kleinbuchstaben, Ziffern und Bindestriche.
          if ! printf '%s' "$APP" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::'$APP' ist kein gültiger Fly-App-Name. Erlaubt sind nur Kleinbuchstaben, Ziffern und Bindestriche — keine Leerzeichen, Punkte oder Großbuchstaben."
            exit 1
          fi

          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App existiert bereits."
            exit 0
          fi

          echo "App existiert noch nicht — wird angelegt."
          if flyctl apps create "$APP" --org "$FLY_ORG" 2> create-error.txt; then
            echo "Angelegt."
            exit 0
          fi

          cat create-error.txt
          echo ""
          echo "::error::Die App '$APP' konnte nicht angelegt werden. Die drei häufigsten Ursachen stehen unten in der Zusammenfassung."

          {
            echo "### Deploy fehlgeschlagen: App konnte nicht angelegt werden"
            echo ""
            echo "Fly meldet:"
            echo ""
            echo '```'
            cat create-error.txt
            echo '```'
            echo ""
            echo "**Wenn dort \`unauthorized\` steht,** ist fast immer die Token-Art die Ursache:"
            echo "Ein *Deploy-Token* ist an eine bestehende App gebunden und darf keine neuen anlegen."
            echo ""
            echo "Zwei Wege:"
            echo ""
            echo "1. **App einmalig im Fly-Dashboard anlegen** (fly.io → Launch a new app),"
            echo "   exakt unter dem Namen \`$APP\`. Danach genügt der Deploy-Token für alle weiteren Läufe."
            echo "2. **Org-weiten Token verwenden:** fly.io → Account → Access Tokens →"
            echo "   einen Token für die *Organisation* statt für eine App erstellen und als"
            echo "   \`FLY_API_TOKEN\` hinterlegen."
            echo ""
            echo "**Wenn dort steht, der Name sei vergeben:** Fly-App-Namen sind weltweit eindeutig."
            echo "Dann in \`fly.toml\` die Zeile \`app = "…"\` auf einen freien Namen ändern."
            echo ""
            echo "**Wenn die Organisation nicht gefunden wird:** Repository-Variable \`FLY_ORG\`"
            echo "auf den Namen deiner Fly-Organisation setzen (aktuell: \`$FLY_ORG\`)."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # Ohne zugewiesene IP-Adresse gibt es für <app>.fly.dev keinen
      # DNS-Eintrag: Der Deploy läuft durch, die Maschinen sind gesund, und der
      # Aufruf scheitert trotzdem mit ERR_NAME_NOT_RESOLVED.
      #
      # `fly launch` weist die Adressen automatisch zu, eine über das Dashboard
      # oder `apps create` angelegte App bekommt sie nicht.
      - name: IP-Adressen sicherstellen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          IPS=$(flyctl ips list --app "$APP" 2>/dev/null || true)
          echo "$IPS"

          if printf '%s' "$IPS" | grep -qE '^\s*v4'; then
            echo "IPv4 vorhanden."
          else
            echo "IPv4 wird zugewiesen (shared, kostenfrei)."
            flyctl ips allocate-v4 --shared --app "$APP" || \
              echo "::warning::IPv4 konnte nicht zugewiesen werden."
          fi

          if printf '%s' "$IPS" | grep -qE '^\s*v6'; then
            echo "IPv6 vorhanden."
          else
            echo "IPv6 wird zugewiesen."
            flyctl ips allocate-v6 --app "$APP" || \
              echo "::warning::IPv6 konnte nicht zugewiesen werden."
          fi

          echo "--- Stand danach ---"
          flyctl ips list --app "$APP" || true

      # Server-Schlüssel gehören NICHT ins Browser-Bundle. Sie werden als
      # Fly-Secrets hinterlegt und zur Laufzeit gelesen.
      #
      # `--stage` schreibt sie, ohne die App neu zu starten; der folgende
      # Deploy übernimmt sie. Ohne das Flag würde jeder Lauf einen zusätzlichen
      # Neustart auslösen.
      - name: Server-Secrets übertragen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          GOINGELECTRIC_API_KEY: ${{ secrets.GOINGELECTRIC_API_KEY }}
          OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          args=()
          add() {
            if [ -n "${2:-}" ]; then
              args+=("$1=$2")
              echo "  gesetzt: $1"
            else
              echo "  übersprungen (leer): $1"
            fi
          }
          add TANKERKOENIG_API_KEY  "${TANKERKOENIG_API_KEY:-}"
          add GOINGELECTRIC_API_KEY "${GOINGELECTRIC_API_KEY:-}"
          add OPENCHARGEMAP_API_KEY "${OPENCHARGEMAP_API_KEY:-}"
          add VAPID_PUBLIC_KEY      "${VAPID_PUBLIC_KEY:-}"
          add VAPID_PRIVATE_KEY     "${VAPID_PRIVATE_KEY:-}"
          add VAPID_SUBJECT         "${VAPID_SUBJECT:-}"

          if [ ${#args[@]} -eq 0 ]; then
            echo "Keine Server-Secrets hinterlegt — die App läuft mit Open Charge Map und ohne Push."
          else
            flyctl secrets set --stage --app "$APP" "${args[@]}"
          fi

      # Die VITE_-Werte werden zur BUILD-Zeit in das Browser-Bundle eingebacken
      # und müssen deshalb als Build-Argumente kommen, nicht als Fly-Secrets.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --app "$APP" \
            --build-arg VITE_MAPBOX_TOKEN="${{ secrets.VITE_MAPBOX_TOKEN }}" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_GEOCODING_COUNTRIES="de,at,ch"

      # Ein Deploy, den niemand aufrufen kann, ist kein erfolgreicher Deploy.
      # Fly meldet gesunde Maschinen auch dann, wenn die App mangels
      # IP-Zuweisung gar nicht im DNS steht — deshalb hier ein echter Aufruf
      # von außen, mit Geduld für die DNS-Verbreitung.
      - name: App von außen aufrufen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          URL="https://$APP.fly.dev"
          echo "Prüfe $URL/api/health"

          ok=0
          for versuch in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/api/health" -o health.json 2>/dev/null; then
              ok=1
              break
            fi
            echo "  Versuch $versuch: noch keine Antwort, warte 10 s …"
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::$URL antwortet nicht. Häufigste Ursache: der App fehlen IP-Adressen (dann steht sie nicht im DNS). Siehe den Schritt 'IP-Adressen sicherstellen' weiter oben."
            {
              echo "### Deploy ausgeliefert, aber nicht erreichbar :warning:"
              echo ""
              echo "\`$URL\` antwortet nicht auf \`/api/health\`."
              echo ""
              echo "Prüfe die Ausgabe von \`flyctl ips list\` im Schritt *IP-Adressen sicherstellen*:"
              echo "Ohne einen v4- oder v6-Eintrag gibt es keinen DNS-Eintrag für die Domain."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Antwort:"
          cat health.json
          echo ""

          CAPS=$(curl -fsS --max-time 10 "$URL/api/capabilities" || echo '{}')
          # Auch ins Log, nicht nur in die Zusammenfassung: Beim Nachsehen,
          # warum eine Quelle fehlt, ist das Log die Stelle, an der man sucht.
          echo "Aktive Datenquellen: $CAPS"

          {
            echo "### Deploy fertig :rocket:"
            echo ""
            echo "**$URL** antwortet."
            echo ""
            echo "Aktive Datenquellen:"
            echo ""
            echo '```json'
            echo "$CAPS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
