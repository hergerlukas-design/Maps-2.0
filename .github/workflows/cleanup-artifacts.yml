name: Artefakte aufräumen

# Löscht alle Artefakte dieses Repos, um das Kontingent für Actions-Storage
# freizugeben. GitHub rechnet die Belegung danach erst nach 6–12 Stunden neu.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Alle Artefakte löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Erst alle IDs sammeln, dann löschen: Löschen während des Blätterns
          # verschiebt die Seiten und ließe Artefakte aus.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.size_in_bytes) \(.name)"' > artifacts.txt
          count=0; bytes=0
          while read -r id size name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "gelöscht: $name ($size Bytes)"
            count=$((count + 1)); bytes=$((bytes + size))
          done < artifacts.txt
          {
            echo "## Artefakte aufräumen"
            echo
            echo "$count Artefakte gelöscht, zusammen $((bytes / 1024 / 1024)) MB."
            echo
            echo "GitHub rechnet das Kontingent nach 6–12 Stunden neu."
          } >> "$GITHUB_STEP_SUMMARY"
